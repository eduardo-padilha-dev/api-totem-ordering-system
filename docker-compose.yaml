services:
  # ── APLICAÇÃO STARTER (EXPRESS + TYPESCRIPT) ─────────────────────────────────
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: api_nosql_app
    ports:
      - "3400:3400"
    environment:
      - PORT=3400
      - MONGO_URI=mongodb://root:root@mongo:27017
      - MONGO_DB_NAME=totem_ordering_system
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
    volumes:
      - ./app/src:/app/src
      - ./init:/app/init:ro
    depends_on:
      - mongo
      - redis
      - elasticsearch
    restart: unless-stopped

  # ── MONGODB & MONGO EXPRESS ──────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: api_nosql_mongo
    command: ["mongod", "--config", "/etc/mongod.conf"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27034:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_logs:/var/log/mongodb
      - ./mongod.conf:/etc/mongod.conf:ro
      - ./init/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    container_name: api_nosql_mongo_express
    ports:
      - "8401:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: root
      ME_CONFIG_MONGODB_URL: mongodb://root:root@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo
    restart: unless-stopped

  # ── REDIS & REDIS COMMANDER ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: api_nosql_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6334:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: api_nosql_redis_commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8402:8081"
    depends_on:
      - redis
    restart: unless-stopped

  # ── ELASTICSEARCH & ELASTICVUE ────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: api_nosql_elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9234:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
      - ./elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    restart: unless-stopped

  elasticvue:
    image: cars10/elasticvue:latest
    container_name: api_nosql_elasticvue
    ports:
      - "8400:8080"
    depends_on:
      - elasticsearch
    restart: unless-stopped

volumes:
  mongo_data:
  mongo_logs:
  redis_data:
  elastic_data:

# mongod.conf — configuração do MongoDB para ambiente de estudo
# Disciplina: Banco de Dados NoSQL — TSI34E / UTFPR Guarapuava
#
# Referência rápida de seções:
#   storage     → onde os dados ficam no disco
#   systemLog   → onde os logs são escritos
#   net         → porta e quem pode conectar
#   security    → autenticação (usuário/senha)
#   operationProfiling → slow query log (benchmark de queries)
#   replication → Replica Set (comentado — só ativar se tiver 3 instâncias)

# ── Armazenamento ─────────────────────────────────────────────────────────────
storage:
  dbPath: /data/db              # caminho padrão do container MongoDB
  # journal.enabled foi removido no MongoDB 7 — journaling é sempre ativo

# ── Logs ──────────────────────────────────────────────────────────────────────
systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true               # acumula logs entre restarts
  verbosity: 0                  # 0=normal | 1-5=debug (aumenta volume de log)
  component:
    query:
      verbosity: 1              # loga detalhes de execução de queries

# ── Rede ──────────────────────────────────────────────────────────────────────
net:
  port: 27017
  # No container, bindIp 0.0.0.0 é necessário para aceitar conexões externas
  # (o isolamento de rede fica por conta do Docker, não do bindIp)
  bindIp: 0.0.0.0

# ── Segurança ─────────────────────────────────────────────────────────────────
security:
  authorization: enabled        # exige autenticação (usuário root já criado via env)

# ── Slow Query Log (Profiler) ─────────────────────────────────────────────────
# Registra automaticamente queries que demoram mais que o threshold
# Nível 0 = desligado | 1 = só slow queries | 2 = todas as queries
operationProfiling:
  mode: slowOp                  # equivale ao nível 1
  slowOpThresholdMs: 100        # queries acima de 100ms são registradas
  # Para ver as queries lentas no mongosh:
  #   use totem_ordering_system
  #   db.system.profile.find().sort({ ts: -1 }).limit(5).pretty()

# ── Replica Set (desativado — descomente para usar) ───────────────────────────
# Para ativar: descomentar, subir 3 instâncias e rodar rs.initiate() no mongosh
#replication:
#  replSetName: "rs0"
